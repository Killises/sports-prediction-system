
services:
  postgres:
    image: postgres:16
    container_name: sps-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sports_prediction
      POSTGRES_USER: sps_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sps_user -d sports_prediction"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
